<canvas id="falling-hearts-canvas" aria-hidden="true"></canvas>
<style>
  #falling-hearts-canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 20;
  }
</style>
<script>
(function () {
  var canvas = document.getElementById('falling-hearts-canvas');
  if (!canvas) return;
  var ctx = canvas.getContext('2d');
  if (!ctx) return;

  var width = canvas.width = window.innerWidth;
  var height = canvas.height = window.innerHeight;

  window.addEventListener('resize', function () {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
  });

  var colors = [
    'rgba(255, 215, 120, 0.72)',
    'rgba(255, 182, 193, 0.65)',
    'rgba(255, 255, 255, 0.5)',
    'rgba(232, 90, 106, 0.55)',
    'rgba(250, 224, 165, 0.7)'
  ];

  var count = Math.min(8, Math.max(4, Math.floor(window.innerWidth / 160)));
  var hearts = [];
  for (var i = 0; i < count; i++) {
    hearts.push({
      x: Math.random() * width,
      y: Math.random() * height,
      size: Math.random() * 10 + 8,
      speedX: (Math.random() - 0.5) * 0.4,
      speedY: Math.random() * 0.7 + 0.35,
      rotation: Math.random() * 360,
      rotationSpeed: (Math.random() - 0.5) * 1.2,
      sway: Math.random() * Math.PI * 2,
      swaySpeed: Math.random() * 0.02 + 0.008,
      color: colors[Math.floor(Math.random() * colors.length)]
    });
  }

  function drawHeart(h) {
    ctx.save();
    ctx.translate(h.x, h.y);
    ctx.rotate((h.rotation * Math.PI) / 180);
    ctx.fillStyle = h.color;
    ctx.shadowColor = h.color;
    ctx.shadowBlur = 8;
    var s = h.size;
    ctx.beginPath();
    ctx.moveTo(0, s * 0.3);
    ctx.bezierCurveTo(-s * 0.15, -s * 0.15, -s * 0.55, -s * 0.1, -s * 0.5, s * 0.2);
    ctx.bezierCurveTo(-s * 0.45, s * 0.55, 0, s * 0.85, 0, s);
    ctx.bezierCurveTo(0, s * 0.85, s * 0.45, s * 0.55, s * 0.5, s * 0.2);
    ctx.bezierCurveTo(s * 0.55, -s * 0.1, s * 0.15, -s * 0.15, 0, s * 0.3);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function render() {
    ctx.clearRect(0, 0, width, height);
    hearts.forEach(function (h) {
      h.sway += h.swaySpeed;
      h.x += h.speedX + Math.sin(h.sway) * 0.55;
      h.y += h.speedY;
      h.rotation += h.rotationSpeed;
      if (h.y > height + 24) {
        h.y = -24;
        h.x = Math.random() * width;
      }
      if (h.x > width + 24) h.x = -24;
      if (h.x < -24) h.x = width + 24;
      drawHeart(h);
    });
    requestAnimationFrame(render);
  }

  render();
})();
</script>

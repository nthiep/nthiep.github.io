# main text of home
name: Hiep Nguyen
bio: Software Development Engineer - Viet Nam

# twitter summary info
description: Mobile developer

repository: nthiep/nthiep.github.io

# if it's an external image, update below for true
# better with square images
external-image: false
picture: assets/images/profile.jpg

# your site color theme, true for dark theme, 
# false to light theme, auto to switch with system.
dark-theme: auto

# If you want to include your resume, set to true
# and specify source (external or local).
resume: true
resume-external: true
resume-url: https://www.linkedin.com/in/hiepvn/

url: https://hiep.vn

permalink: /:title/

# To enable google analytics, supply your token below
analytics-google: 'G-DMCZ87RZJZ'

# To enable piwik tracking, supply your url & site ID below
# analytics-piwik-url: 'piwik.my-host.com'
# analytics-piwik-id: 1

# if you don't want comments in your posts, leave categories empty
disqus: false

# if you don't have any of social below, comment the line
facebook: hiepzg
twitter: hiepzg
instagram: hiepzg
# pinterest: mypinterest
linkedin: hiepvn
youtube: "@hiep.nguyen"
# spotify: myspotify
github: nthiep
gitlab: hiep
# lastfm: mylastfm
# stackoverflow: 7044681/mystackoverflow
# quora: userquora
# reddit: username
# medium: nthiep
# vimeo: myvimeo
# lanyrd: mylanyrd
email: contact@hiep.vn

authors:
    hiep:
        name: Hiep Nguyen
        bio: Software Development Engineer - Viet Nam
        external-image: false
        picture: assets/images/profile.jpg
        twitter: hiepzg

# do you want a larger site? change the option below
# options: [normal, large] | default: normal
# normal = 560px / large = 810px
width: large

# if you do/don't need pagination, toggle 'enabled' between true/false below
pagination:
    enabled: false
    sort_reverse: true # display recent posts first
    title: ':title' # Changing this will mess up the header display logic
    per_page: 5 
    permalink: "/:num/" # pagination link that will be appended

# if you don't need projects, comment the *projects* configs below
projects: true

# if you don't need "about" or "blog", comment them out below
about: true
blog: true

# do you want to show the "read time" of the posts?
read-time: true

# do you want to show the "tags" inside the posts?
show-tags: true

# related posts inside a post?
related: true

# Display links for next and previous posts for the specified categories
post-advance-links: [blog]

# show author block at the end of a post ?
show-author: true

# do you want some animations?
animation: true

# add default values to specific pages or layouts
defaults:
  -
    scope:
      path: "" # an empty string here means all files in the project
      layout: "post"
    values:
      # setting all post to not hidden by default, 
      # can be overridden in the front matter for a specific post
      hidden: false 
      
plugins:
  - jekyll-seo-tag
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-paginate-v2


jekyll-mentions:
    base_url: https://github.com

compress_html:
    ignore:
        envs:
        - development
        - stage

keep_files:
  - wedding-invitation

exclude:
  - travis.sh
  - Rakefile
  - README.md
  - Gemfile
  - Gemfile.lock
  - FAQ.md
  - node_modules
  - vendor
  - scripts
  - wedding-invitation/node_modules
  - wedding-invitation/src
  - wedding-invitation/public
  - wedding-invitation/dist
  - wedding-invitation/scripts
  - wedding-invitation/index.html
  - wedding-invitation/package.json
  - wedding-invitation/package-lock.json
  - wedding-invitation/bun.lock
  - wedding-invitation/tsconfig.json
  - wedding-invitation/vite.config.ts
  - wedding-invitation/vite-env.d.ts
  - wedding-invitation/metadata.json
  - wedding-invitation/README.md
  - wedding-invitation/.env
  - wedding-invitation/.env.example
  - wedding-invitation/.gitignore
  - wedding-invitation/.nvmrc

name: Deploy Jekyll site to Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build wedding invitation
        env:
          # Public Apps Script web app URL. Secret/var override if set.
          # Build job does not use the github-pages environment, so
          # environment-only secrets are invisible here.
          VITE_RSVP_WEBAPP_URL: ${{ secrets.VITE_RSVP_WEBAPP_URL || vars.VITE_RSVP_WEBAPP_URL || 'https://script.google.com/macros/s/AKfycbz_tsyEi-tItx-xVtjlD6hniMRsaUGbE6p_-59kKmwL9iOKB6YQGp85DpaCWVOX9cR3/exec' }}
        run: |
          cd wedding-invitation
          npm install
          npm run build

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --future --baseurl "${{ steps.pages.outputs.base_path }}"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
